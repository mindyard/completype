[workspace]
resolver = "2"
members = ["crates/completype", "crates/completype-cli", "crates/completype-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
authors = ["Saiful Islam"]
repository = "https://github.com/mindyard/completype"
homepage = "https://github.com/mindyard/completype"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
